openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API for WealthNova account access and member-facing pages
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Phone-number account access
  - name: referrals
    description: Member referral relationships
  - name: dashboard
    description: Member dashboard data
  - name: plans
    description: Available plans
  - name: deposits
    description: Deposit availability
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a member account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationInput"
      responses:
        "201":
          description: Account registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "400":
          description: Invalid registration details or referral code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Mobile number is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with a mobile number and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Return the current authenticated member
      responses:
        "200":
          description: Current member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /referrals/validate:
    post:
      operationId: validateReferralCode
      tags: [referrals]
      summary: Check whether a referral code can be used
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferralCodeInput"
      responses:
        "200":
          description: Referral code validity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralValidation"
  /referrals/me:
    get:
      operationId: getMyReferrals
      tags: [referrals]
      summary: Return the member's referral link and referral count
      responses:
        "200":
          description: Member referral details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralOverview"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Return real account and referral summary values
      responses:
        "200":
          description: Member dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /plans:
    get:
      operationId: getPlans
      tags: [plans]
      summary: List currently configured plans
      responses:
        "200":
          description: Configured plans, or an empty array if none are available
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"
  /deposits/status:
    get:
      operationId: getDepositStatus
      tags: [deposits]
      summary: Report whether a real deposit provider is configured
      responses:
        "200":
          description: Deposit feature availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositAvailability"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    SuccessResponse:
      type: object
      properties:
        status:
          type: string
      required: [status]
    SessionUser:
      type: object
      properties:
        id:
          type: string
        mobileNumber:
          type: string
        referralCode:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, INVITE_ONLY]
        referredBy:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required: [id, mobileNumber, referralCode, role, status, referredBy, createdAt]
    RegistrationInput:
      type: object
      properties:
        mobileNumber:
          type: string
          minLength: 8
          maxLength: 16
          pattern: "^\\+[1-9][0-9]{7,14}$"
        password:
          type: string
          minLength: 12
          maxLength: 128
        referralCode:
          type: string
          minLength: 3
          maxLength: 32
      required: [mobileNumber, password, referralCode]
    LoginInput:
      type: object
      properties:
        mobileNumber:
          type: string
          minLength: 8
          maxLength: 16
          pattern: "^\\+[1-9][0-9]{7,14}$"
        password:
          type: string
          minLength: 1
          maxLength: 128
      required: [mobileNumber, password]
    ReferralCodeInput:
      type: object
      properties:
        referralCode:
          type: string
          minLength: 3
          maxLength: 32
      required: [referralCode]
    ReferralValidation:
      type: object
      properties:
        valid:
          type: boolean
        message:
          type: string
      required: [valid, message]
    ReferralOverview:
      type: object
      properties:
        referralCode:
          type: string
        referralLink:
          type: string
          format: uri-reference
        referralCount:
          type: integer
          minimum: 0
      required: [referralCode, referralLink, referralCount]
    DashboardSummary:
      type: object
      properties:
        referralCount:
          type: integer
          minimum: 0
        role:
          type: string
          enum: [USER, ADMIN]
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, INVITE_ONLY]
        createdAt:
          type: string
          format: date-time
      required: [referralCount, role, status, createdAt]
    Plan:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        currency:
          type: string
        minimumAmount:
          type: number
          minimum: 0
        status:
          type: string
          enum: [AVAILABLE, UNAVAILABLE]
      required: [id, name, description, currency, minimumAmount, status]
    DepositAvailability:
      type: object
      properties:
        enabled:
          type: boolean
        message:
          type: string
      required: [enabled, message]

