openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API for WealthNova account access and member-facing pages
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Phone-number account access
  - name: referrals
    description: Member referral relationships
  - name: dashboard
    description: Member dashboard data
  - name: plans
    description: Available plans
  - name: deposits
    description: Deposit availability
  - name: investments
    description: Member investments and portfolio totals
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a member account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationInput"
      responses:
        "201":
          description: Account registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "400":
          description: Invalid registration details or referral code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Mobile number is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with a mobile number and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Return the current authenticated member
      responses:
        "200":
          description: Current member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /referrals/validate:
    post:
      operationId: validateReferralCode
      tags: [referrals]
      summary: Check whether a referral code can be used
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferralCodeInput"
      responses:
        "200":
          description: Referral code validity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralValidation"
  /referrals/me:
    get:
      operationId: getMyReferrals
      tags: [referrals]
      summary: Return the member's referral link and referral count
      responses:
        "200":
          description: Member referral details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralOverview"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Return real account and referral summary values
      responses:
        "200":
          description: Member dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /plans:
    get:
      operationId: getPlans
      tags: [plans]
      summary: List currently configured plans
      responses:
        "200":
          description: Configured plans, or an empty array if none are available
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"
  /deposits/status:
    get:
      operationId: getDepositStatus
      tags: [deposits]
      summary: Report whether a real deposit provider is configured
      responses:
        "200":
          description: Deposit feature availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositAvailability"
  /investments:
    post:
      operationId: startInvestment
      tags: [investments]
      summary: Start an investment using the authenticated member's available balance
      description: The server resolves principal and daily values from the selected plan. Amounts are never accepted from the client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestmentStartInput"
      responses:
        "201":
          description: Investment created and principal debited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestmentStartResult"
        "200":
          description: An idempotent replay of the original investment request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestmentStartResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Plan unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Insufficient balance or idempotency key conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    SuccessResponse:
      type: object
      properties:
        status:
          type: string
      required: [status]
    SessionUser:
      type: object
      properties:
        id:
          type: string
        mobileNumber:
          type: string
        referralCode:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, INVITE_ONLY]
        referredBy:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required: [id, mobileNumber, referralCode, role, status, referredBy, createdAt]
    RegistrationInput:
      type: object
      properties:
        mobileNumber:
          type: string
          minLength: 8
          maxLength: 16
          pattern: "^(09[0-9]{9}|\\+639[0-9]{9}|639[0-9]{9})$"
        password:
          type: string
          minLength: 12
          maxLength: 128
        referralCode:
          type: string
          minLength: 3
          maxLength: 32
      required: [mobileNumber, password, referralCode]
    LoginInput:
      type: object
      properties:
        mobileNumber:
          type: string
          minLength: 8
          maxLength: 16
          pattern: "^(09[0-9]{9}|\\+639[0-9]{9}|639[0-9]{9})$"
        password:
          type: string
          minLength: 1
          maxLength: 128
      required: [mobileNumber, password]
    ReferralCodeInput:
      type: object
      properties:
        referralCode:
          type: string
          minLength: 3
          maxLength: 32
      required: [referralCode]
    ReferralValidation:
      type: object
      properties:
        valid:
          type: boolean
        message:
          type: string
      required: [valid, message]
    ReferralOverview:
      type: object
      properties:
        referralCode:
          type: string
        referralLink:
          type: string
          format: uri-reference
        referralCount:
          type: integer
          minimum: 0
      required: [referralCode, referralLink, referralCount]
    DashboardSummary:
      type: object
      properties:
        referralCount:
          type: integer
          minimum: 0
        role:
          type: string
          enum: [USER, ADMIN]
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, INVITE_ONLY]
        createdAt:
          type: string
          format: date-time
        availableBalance:
          type: string
          description: Exact PHP balance formatted with two decimal places.
          pattern: "^[0-9]+\\.[0-9]{2}$"
        totalInvested:
          type: string
          description: Sum of non-cancelled investment principals.
          pattern: "^[0-9]+\\.[0-9]{2}$"
        totalEarnings:
          type: string
          description: Verified earning credits only; scheduled plan figures are not credited automatically.
          pattern: "^[0-9]+\\.[0-9]{2}$"
        activeInvestments:
          type: array
          items:
            $ref: "#/components/schemas/ActiveInvestment"
      required: [referralCount, role, status, createdAt, availableBalance, totalInvested, totalEarnings, activeInvestments]
    ActiveInvestment:
      type: object
      properties:
        id:
          type: string
        planId:
          type: string
        planName:
          type: string
        principalAmount:
          type: string
          pattern: "^[0-9]+\\.[0-9]{2}$"
        dailyAmount:
          type: string
          description: Informational plan figure; not a guaranteed or automatically credited earning.
          pattern: "^[0-9]+\\.[0-9]{2}$"
        duration:
          type: integer
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        daysCompleted:
          type: integer
        daysRemaining:
          type: integer
        accumulatedAmount:
          type: string
          description: Verified earnings credited to this investment only.
          pattern: "^[0-9]+\\.[0-9]{2}$"
        status:
          type: string
          enum: [ACTIVE, COMPLETED, CANCELLED]
      required: [id, planId, planName, principalAmount, dailyAmount, duration, startDate, endDate, daysCompleted, daysRemaining, accumulatedAmount, status]
    Plan:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        currency:
          type: string
        principalAmount:
          type: string
          pattern: "^[0-9]+\\.[0-9]{2}$"
        dailyAmount:
          type: string
          description: Informational plan figure; not a guaranteed or automatically credited earning.
          pattern: "^[0-9]+\\.[0-9]{2}$"
        duration:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [AVAILABLE, UNAVAILABLE]
      required: [id, name, currency, principalAmount, dailyAmount, duration, status]
    InvestmentStartInput:
      type: object
      properties:
        planId:
          type: string
          minLength: 1
          maxLength: 64
        idempotencyKey:
          type: string
          minLength: 16
          maxLength: 128
      required: [planId, idempotencyKey]
    InvestmentStartResult:
      type: object
      properties:
        investment:
          $ref: "#/components/schemas/ActiveInvestment"
        availableBalance:
          type: string
          pattern: "^[0-9]+\\.[0-9]{2}$"
        replayed:
          type: boolean
      required: [investment, availableBalance, replayed]
    DepositAvailability:
      type: object
      properties:
        enabled:
          type: boolean
        message:
          type: string
      required: [enabled, message]

