        availableBalance: { type: string }
        reservedBalance: { type: string }
        feePercent: { type: number }
        activeWithdrawalId: { type: [string, "null"] }
        notifications: { type: array, items: { $ref: "#/components/schemas/WithdrawalNotification" } }
    WithdrawalAuditEntry:
      type: object
      required: [id, adminId, decision, payoutReference, note, createdAt]
      properties:
        id: { type: string }
