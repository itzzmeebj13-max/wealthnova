openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API for WealthNova account access and member-facing pages
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Phone-number account access
  - name: referrals
    description: Member referral relationships
  - name: dashboard
    description: Member dashboard data
  - name: plans
    description: Available plans
  - name: deposits
    description: Deposit availability
  - name: investments
    description: Member investments and portfolio totals
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a member account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationInput"
      responses:
        "201":
          description: Account registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "400":
          description: Invalid registration details or referral code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Mobile number is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with a mobile number and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Return the current authenticated member
      responses:
        "200":
          description: Current member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /referrals/validate:
    post:
      operationId: validateReferralCode
      tags: [referrals]
      summary: Check whether a referral code can be used
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferralCodeInput"
      responses:
        "200":
          description: Referral code validity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralValidation"
  /referrals/me:
    get:
      operationId: getMyReferrals
      tags: [referrals]
      summary: Return the member's referral link and referral count
      responses:
        "200":
          description: Member referral details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralOverview"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Return real account and referral summary values
      responses:
        "200":
          description: Member dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /plans:
    get:
      operationId: getPlans
      tags: [plans]
      summary: List currently configured plans
      responses:
        "200":
          description: Configured plans, or an empty array if none are available
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"
  /deposits/status:
    get:
      operationId: getDepositStatus
      tags: [deposits]
      summary: Report whether a real deposit provider is configured
      responses:
        "200":
          description: Deposit feature availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositAvailability"
  /investments:
    post:
      operationId: startInvestment
      tags: [investments]
      summary: Start an investment using the authenticated member's available balance
      description: The server resolves principal and daily values from the selected plan. Amounts are never accepted from the client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestmentStartInput"
      responses:
        "201":
          description: Investment created and principal debited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestmentStartResult"
        "200":
          description: An idempotent replay of the original investment request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestmentStartResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Plan unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Insufficient balance or idempotency key conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deposits/settings:
    get:
      operationId: getDepositPaymentSettings
      tags: [deposits]
      responses:
        "200":
          description: Manual payment details and submission availability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepositPaymentSettings" }
  /admin/deposits/settings:
    put:
      operationId: updateDepositPaymentSettings
      tags: [deposits]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DepositPaymentSettingsInput" }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepositPaymentSettings" }
        "403":
          description: Administrator access required
        "409":
          description: Settings changed; reload before saving
  /deposits/images:
    post:
      operationId: uploadDepositImage
      tags: [deposits]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/DepositImageInput" }
      responses:
        "201":
          description: Validated private image
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepositImage" }
        "400":
          description: Invalid image
        "413":
          description: Image exceeds 5 MB
  /deposits/images/{imageId}:
    get:
      operationId: getDepositImage
      tags: [deposits]
      parameters:
        - name: imageId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Authorized image bytes
          content:
            image/png:
              schema: { type: string, format: binary }
        "404":
          description: Image missing or not accessible
  /deposits/requests:
    get:
      operationId: getMyDepositRequests
      tags: [deposits]
      responses:
        "200":
          description: Current user's submitted requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DepositRequest" }
    post:
      operationId: submitDepositRequest
      tags: [deposits]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DepositRequestInput" }
      responses:
        "201":
          description: Saved pending verification; wallet not credited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepositRequest" }
        "200":
          description: Idempotent replay of saved request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepositRequest" }
        "409":
          description: Duplicate reference or receipt, or settings changed
  /admin/deposits/requests:
    get:
      operationId: getAdminDepositRequests
      tags: [deposits]
      summary: Administrator-only paginated deposit review dashboard
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [ALL, PENDING_VERIFICATION, APPROVED, REJECTED], default: PENDING_VERIFICATION }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Authorized deposit review queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDepositList" }
        "403":
          description: Administrator access required
  /admin/deposits/requests/{depositId}/approve:
    post:
      operationId: approveDepositRequest
      tags: [deposits]
      summary: Credit a deposit once after independent payment verification
      parameters:
        - name: depositId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DepositApprovalInput" }
      responses:
        "200":
          description: Approved or already approved; no duplicate credit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepositDecisionResult" }
        "400":
          description: Payment confirmation, positive verified amount, or discrepancy acknowledgment missing
        "403":
          description: Not an administrator or attempting self-approval
        "409":
          description: Rejected deposit or concurrent decision conflict
  /admin/deposits/requests/{depositId}/reject:
    post:
      operationId: rejectDepositRequest
      tags: [deposits]
      parameters:
        - name: depositId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DepositRejectionInput" }
      responses:
        "200":
          description: Rejected with reason, without wallet credit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepositDecisionResult" }
        "403":
          description: Administrator access required
        "409":
          description: Already approved or conflicting decision
  /admin/deposits/requests/{depositId}/audit:
    get:
      operationId: getDepositDecisionAudit
      tags: [deposits]
      parameters:
        - name: depositId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "200":
          description: Immutable decision audit entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DepositDecisionAudit" }
        "403":
          description: Administrator access required
components:
  schemas:
    DepositPaymentSettings:
      type: object
      required: [configured, enabled, submissionsEnabled, accountDetailsConfirmed, blockingReasons, accountName, accountNumber, instructions, minimumAmount, qrImageId, qrImageUrl, version]
      properties:
        configured: { type: boolean }
        enabled: { type: boolean }
        submissionsEnabled: { type: boolean }
        accountDetailsConfirmed: { type: boolean }
        blockingReasons:
          type: array
          items: { type: string }
        accountName: { type: string }
        accountNumber: { type: string }
        instructions: { type: string }
        minimumAmount: { type: string }
        qrImageId: { type: [string, "null"] }
        qrImageUrl: { type: [string, "null"] }
        version: { type: integer }
    DepositPaymentSettingsInput:
      type: object
      required: [accountName, accountNumber, instructions, minimumAmount, qrImageId, submissionsEnabled, expectedVersion]
      properties:
        accountDetailsConfirmed: { type: boolean, default: false }
        accountName: { type: string, maxLength: 120 }
        accountNumber: { type: string, maxLength: 32 }
        instructions: { type: string, maxLength: 3000 }
        minimumAmount: { type: string, pattern: '^\d{1,12}(\.\d{1,2})?$' }
        qrImageId: { type: [string, "null"], maxLength: 100 }
        submissionsEnabled: { type: boolean }
        expectedVersion: { type: integer, minimum: 0 }
    DepositImageInput:
      type: object
      required: [purpose, file]
      properties:
        purpose: { type: string, enum: [QR, RECEIPT] }
        file: { type: string, format: binary }
    DepositImage:
      type: object
      required: [id, url, purpose, size]
      properties:
        id: { type: string }
        url: { type: string }
        purpose: { type: string, enum: [QR, RECEIPT] }
        size: { type: integer }
    DepositRequestInput:
      type: object
      required: [amount, transactionReference, receiptImageId, idempotencyKey, settingsVersion]
      properties:
        amount: { type: string, pattern: '^\d{1,12}(\.\d{1,2})?$' }
        transactionReference: { type: string, minLength: 6, maxLength: 64 }
        receiptImageId: { type: string, minLength: 1, maxLength: 100 }
        idempotencyKey: { type: string, minLength: 16, maxLength: 128 }
        settingsVersion: { type: integer, minimum: 0 }
    DepositRequest:
      type: object
      required: [id, amount, transactionReference, receiptUrl, status, accountName, accountNumber, createdAt, rejectionReason, reviewedAt, approvedAt, verifiedAmount]
      properties:
        id: { type: string }
        amount: { type: string }
        transactionReference: { type: string }
        receiptUrl: { type: string }
        status: { type: string, enum: [PENDING_VERIFICATION, APPROVED, REJECTED] }
        accountName: { type: string }
        accountNumber: { type: string }
        createdAt: { type: string, format: date-time }
        rejectionReason: { type: [string, "null"] }
        reviewedAt: { type: [string, "null"], format: date-time }
        approvedAt: { type: [string, "null"], format: date-time }
        verifiedAmount: { type: [string, "null"] }
    DepositApprovalInput:
      type: object
      required: [verifiedAmount, confirmedPaymentReceived, confirmedAmountDifference, verificationNote]
      properties:
        verifiedAmount: { type: string, pattern: '^\d{1,12}(\.\d{1,2})?$' }
        confirmedPaymentReceived: { type: boolean }
        confirmedAmountDifference: { type: boolean }
        verificationNote: { type: string, minLength: 10, maxLength: 1000 }
    DepositRejectionInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 5, maxLength: 1000 }
    DepositMemberAccount:
      type: object
      required: [id, mobileNumber]
      properties:
        id: { type: string }
        mobileNumber: { type: string }
    AdminDeposit:
      allOf:
        - $ref: "#/components/schemas/DepositRequest"
        - type: object
          required: [user, reviewer]
          properties:
            user: { $ref: "#/components/schemas/DepositMemberAccount" }
            reviewer:
              type: [object, "null"]
              required: [id, mobileNumber]
              properties:
                id: { type: string }
                mobileNumber: { type: string }
    AdminDepositList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminDeposit" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    DepositDecisionResult:
      type: object
      required: [deposit, alreadyProcessed]
      properties:
        deposit: { $ref: "#/components/schemas/AdminDeposit" }
        alreadyProcessed: { type: boolean }
    DepositDecisionAudit:
      type: object
      required: [id, admin, decision, verifiedAmount, verificationNote, amountDifferenceConfirmed, rejectionReason, createdAt]
      properties:
        id: { type: string }
        admin: { $ref: "#/components/schemas/DepositMemberAccount" }
        decision: { type: string, enum: [APPROVED, REJECTED] }
        verifiedAmount: { type: [string, "null"] }
        verificationNote: { type: [string, "null"] }
        amountDifferenceConfirmed: { type: boolean }
        rejectionReason: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    SuccessResponse:
      type: object
      properties:
        status:
          type: string
      required: [status]
    SessionUser:
      type: object
      properties:
        id:
          type: string
        mobileNumber:
          type: string
        referralCode:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, INVITE_ONLY]
        referredBy:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required: [id, mobileNumber, referralCode, role, status, referredBy, createdAt]
    RegistrationInput:
      type: object
      properties:
        mobileNumber:
          type: string
          minLength: 8
          maxLength: 16
          pattern: "^(09[0-9]{9}|\\+639[0-9]{9}|639[0-9]{9})$"
        password:
          type: string
          minLength: 12
          maxLength: 128
        referralCode:
          type: string
          minLength: 3
          maxLength: 32
      required: [mobileNumber, password, referralCode]
    LoginInput:
      type: object
      properties:
        mobileNumber:
          type: string
          minLength: 8
          maxLength: 16
          pattern: "^(09[0-9]{9}|\\+639[0-9]{9}|639[0-9]{9})$"
        password:
          type: string
          minLength: 1
          maxLength: 128
      required: [mobileNumber, password]
    ReferralCodeInput:
      type: object
      properties:
        referralCode:
          type: string
          minLength: 3
          maxLength: 32
      required: [referralCode]
    ReferralValidation:
      type: object
      properties:
        valid:
          type: boolean
        message:
          type: string
      required: [valid, message]
    ReferralOverview:
      type: object
      properties:
        referralCode:
          type: string
        referralLink:
          type: string
          format: uri-reference
        referralCount:
          type: integer
          minimum: 0
      required: [referralCode, referralLink, referralCount]
    DashboardSummary:
      type: object
      properties:
        referralCount:
          type: integer
          minimum: 0
        role:
          type: string
          enum: [USER, ADMIN]
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, INVITE_ONLY]
        createdAt:
          type: string
          format: date-time
        availableBalance:
          type: string
          description: Exact PHP balance formatted with two decimal places.
          pattern: "^[0-9]+\\.[0-9]{2}$"
        totalInvested:
          type: string
          description: Sum of non-cancelled investment principals.
          pattern: "^[0-9]+\\.[0-9]{2}$"
        totalEarnings:
          type: string
          description: Verified earning credits only; scheduled plan figures are not credited automatically.
          pattern: "^[0-9]+\\.[0-9]{2}$"
        activeInvestments:
          type: array
          items:
            $ref: "#/components/schemas/ActiveInvestment"
      required: [referralCount, role, status, createdAt, availableBalance, totalInvested, totalEarnings, activeInvestments]
    ActiveInvestment:
      type: object
      properties:
        id:
          type: string
        planId:
          type: string
        planName:
          type: string
        principalAmount:
          type: string
          pattern: "^[0-9]+\\.[0-9]{2}$"
        dailyAmount:
          type: string
          description: Informational plan figure; not a guaranteed or automatically credited earning.
          pattern: "^[0-9]+\\.[0-9]{2}$"
        duration:
          type: integer
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        daysCompleted:
          type: integer
        daysRemaining:
          type: integer
        accumulatedAmount:
          type: string
          description: Verified earnings credited to this investment only.
          pattern: "^[0-9]+\\.[0-9]{2}$"
        status:
          type: string
          enum: [ACTIVE, COMPLETED, CANCELLED]
      required: [id, planId, planName, principalAmount, dailyAmount, duration, startDate, endDate, daysCompleted, daysRemaining, accumulatedAmount, status]
    Plan:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        currency:
          type: string
        principalAmount:
          type: string
          pattern: "^[0-9]+\\.[0-9]{2}$"
        dailyAmount:
          type: string
          description: Informational plan figure; not a guaranteed or automatically credited earning.
          pattern: "^[0-9]+\\.[0-9]{2}$"
        duration:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [AVAILABLE, UNAVAILABLE]
      required: [id, name, currency, principalAmount, dailyAmount, duration, status]
    InvestmentStartInput:
      type: object
      properties:
        planId:
          type: string
          minLength: 1
          maxLength: 64
        idempotencyKey:
          type: string
          minLength: 16
          maxLength: 128
      required: [planId, idempotencyKey]
    InvestmentStartResult:
      type: object
      properties:
        investment:
          $ref: "#/components/schemas/ActiveInvestment"
        availableBalance:
          type: string
          pattern: "^[0-9]+\\.[0-9]{2}$"
        replayed:
          type: boolean
      required: [investment, availableBalance, replayed]
    DepositAvailability:
      type: object
      properties:
        enabled:
          type: boolean
        message:
          type: string
      required: [enabled, message]

