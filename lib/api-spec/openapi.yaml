openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API for WealthNova account access and member-facing pages
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Phone-number account access
  - name: referrals
    description: Member referral relationships
  - name: dashboard
    description: Member dashboard data
  - name: plans
    description: Available plans
  - name: deposits
    description: Deposit availability
  - name: investments
    description: Member investments and portfolio totals
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a member account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistrationInput"
      responses:
        "201":
          description: Account registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "400":
          description: Invalid registration details or referral code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Mobile number is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with a mobile number and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Return the current authenticated member
      responses:
        "200":
          description: Current member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionUser"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /referrals/validate:
    post:
      operationId: validateReferralCode
      tags: [referrals]
      summary: Check whether a referral code can be used
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReferralCodeInput"
      responses:
        "200":
          description: Referral code validity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralValidation"
  /referrals/me:
    get:
      operationId: getMyReferrals
      tags: [referrals]
      summary: Return the member's referral link and referral count
      responses:
        "200":
          description: Member referral details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReferralOverview"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Return real account and referral summary values
      responses:
        "200":
          description: Member dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /plans:
    get:
      operationId: getPlans
      tags: [plans]
      summary: List currently configured plans
      responses:
        "200":
          description: Configured plans, or an empty array if none are available
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"
  /deposits/status:
    get:
      operationId: getDepositStatus
      tags: [deposits]
      summary: Report whether a real deposit provider is configured
      responses:
        "200":
          description: Deposit feature availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositAvailability"
  /investments:
    post:
      operationId: startInvestment
      tags: [investments]
      summary: Start an investment using the authenticated member's available balance
      description: The server resolves principal and daily values from the selected plan. Amounts are never accepted from the client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestmentStartInput"
      responses:
        "201":
          description: Investment created and principal debited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestmentStartResult"
        "200":
          description: An idempotent replay of the original investment request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestmentStartResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Plan unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Insufficient balance or idempotency key conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /deposits/settings:
    get:
      operationId: getDepositPaymentSettings
      tags: [deposits]
      responses:
        "200":
          description: Manual payment details and submission availability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepositPaymentSettings" }
  /admin/deposits/settings:
    put:
      operationId: updateDepositPaymentSettings
      tags: [deposits]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DepositPaymentSettingsInput" }
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepositPaymentSettings" }
        "403":
          description: Administrator access required
        "409":
          description: Settings changed; reload before saving
  /deposits/images:
    post:
      operationId: uploadDepositImage
      tags: [deposits]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/DepositImageInput" }
      responses:
        "201":
          description: Validated private image
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepositImage" }
        "400":
          description: Invalid image
        "413":
          description: Image exceeds 5 MB
  /deposits/images/{imageId}:
    get:
      operationId: getDepositImage
      tags: [deposits]
      parameters:
        - name: imageId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Authorized image bytes
          content:
            image/png:
              schema: { type: string, format: binary }
        "404":
          description: Image missing or not accessible
  /deposits/requests:
    get:
      operationId: getMyDepositRequests
      tags: [deposits]
      responses:
        "200":
          description: Current user's submitted requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DepositRequest" }
    post:
      operationId: submitDepositRequest
      tags: [deposits]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DepositRequestInput" }
      responses:
        "201":
          description: Saved pending verification; wallet not credited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepositRequest" }
        "200":
          description: Idempotent replay of saved request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepositRequest" }
        "409":
          description: Duplicate reference or receipt, or settings changed
  /admin/deposits/requests:
    get:
      operationId: getAdminDepositRequests
      tags: [deposits]
      summary: Administrator-only paginated deposit review dashboard
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [ALL, PENDING_VERIFICATION, APPROVED, REJECTED], default: PENDING_VERIFICATION }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Authorized deposit review queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDepositList" }
        "403":
          description: Administrator access required
  /admin/deposits/requests/{depositId}/approve:
    post:
      operationId: approveDepositRequest
      tags: [deposits]
      summary: Credit a deposit once after independent payment verification
      parameters:
        - name: depositId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DepositApprovalInput" }
      responses:
        "200":
          description: Approved or already approved; no duplicate credit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepositDecisionResult" }
        "400":
          description: Payment confirmation, positive verified amount, or discrepancy acknowledgment missing
        "403":
          description: Not an administrator or attempting self-approval
        "409":
          description: Rejected deposit or concurrent decision conflict
  /admin/deposits/requests/{depositId}/reject:
    post:
      operationId: rejectDepositRequest
      tags: [deposits]
      parameters:
        - name: depositId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DepositRejectionInput" }
      responses:
        "200":
          description: Rejected with reason, without wallet credit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepositDecisionResult" }
        "403":
          description: Administrator access required
        "409":
          description: Already approved or conflicting decision
  /admin/deposits/requests/{depositId}/audit:
    get:
      operationId: getDepositDecisionAudit
      tags: [deposits]
      parameters:
        - name: depositId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "200":
          description: Immutable decision audit entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DepositDecisionAudit" }
        "403":
          description: Administrator access required
  /withdrawals/summary:
    get:
      operationId: getWithdrawalSummary
      tags: [withdrawals]
      responses:
        "200":
          description: Verified spendable balance, reservations and unread updates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WithdrawalSummary" }
  /withdrawals/quote:
    get:
      operationId: getWithdrawalQuote
      tags: [withdrawals]
      parameters:
        - { name: amount, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Server-calculated five percent fee rounded to the nearest cent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WithdrawalQuote" }
  /withdrawals/requests:
    get:
      operationId: getMyWithdrawals
      tags: [withdrawals]
      responses:
        "200":
          description: Own withdrawal history
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Withdrawal" } }
    post:
      operationId: submitWithdrawal
      tags: [withdrawals]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WithdrawalInput" }
      responses:
        "200":
          description: Request created or safely replayed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Withdrawal" }
  /withdrawals/notifications/{notificationId}/read:
    post:
      operationId: acknowledgeWithdrawalNotification
      tags: [withdrawals]
      parameters:
        - { name: notificationId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Own notification marked read
          content:
            application/json:
              schema: { type: object, required: [success], properties: { success: { type: boolean } } }
  /admin/withdrawals:
    get:
      operationId: getAdminWithdrawals
      tags: [withdrawals]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [ALL, PENDING, PROCESSING, COMPLETED, REJECTED], default: PENDING } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: Admin review queue
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, pageSize]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Withdrawal" } }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
  /admin/withdrawals/{withdrawalId}/process:
    post:
      operationId: processWithdrawal
      tags: [withdrawals]
      parameters:
        - { name: withdrawalId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Claimed for processing; not a payout confirmation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Withdrawal" }
  /admin/withdrawals/{withdrawalId}/complete:
    post:
      operationId: completeWithdrawal
      tags: [withdrawals]
      parameters:
        - { name: withdrawalId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteWithdrawalInput" }
      responses:
        "200":
          description: Actual verified manual payout recorded exactly once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Withdrawal" }
  /admin/withdrawals/{withdrawalId}/reject:
    post:
      operationId: rejectWithdrawal
      tags: [withdrawals]
      parameters:
        - { name: withdrawalId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RejectWithdrawalInput" }
      responses:
        "200":
          description: Rejected with an exactly-once reserve release and user notification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Withdrawal" }
  /admin/withdrawals/{withdrawalId}/audit:
    get:
      operationId: getWithdrawalAudit
      tags: [withdrawals]
      parameters:
        - { name: withdrawalId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Immutable Admin decisions
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/WithdrawalAuditEntry" } }
  /referrals/commissions:
    get:
      operationId: getMyCommissions
      tags: [referrals]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [ALL, PENDING, APPROVED, REJECTED, PAID], default: ALL } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: Own commission history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommissionPage" }
  /admin/commissions:
    get:
      operationId: getAdminCommissions
      tags: [referrals]
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [ALL, PENDING, APPROVED, REJECTED, PAID], default: ALL } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: Admin commission review queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommissionPage" }
  /admin/commissions/{commissionId}/approve:
    post:
      operationId: approveCommission
      tags: [referrals]
      parameters:
        - { name: commissionId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommissionDecisionInput" }
      responses:
        "200":
          description: Approved with a fully funded reservation; not a wallet credit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Commission" }
  /admin/commissions/{commissionId}/reject:
    post:
      operationId: rejectCommission
      tags: [referrals]
      parameters:
        - { name: commissionId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommissionDecisionInput" }
      responses:
        "200":
          description: Rejected with any commission-fund reservation released once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Commission" }
  /admin/commissions/{commissionId}/pay:
    post:
      operationId: payCommission
      tags: [referrals]
      parameters:
        - { name: commissionId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommissionDecisionInput" }
      responses:
        "200":
          description: Reserved verified operating money transferred to member wallet once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Commission" }
  /admin/commissions/{commissionId}/audit:
    get:
      operationId: getCommissionAudit
      tags: [referrals]
      parameters:
        - { name: commissionId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Immutable Admin decisions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CommissionAuditEntry" }
  /admin/commission-fund:
    get:
      operationId: getCommissionFund
      tags: [referrals]
      responses:
        "200":
          description: Verified company funding and reserved commission balances
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommissionFundSummary" }
  /admin/commission-fund/capital:
    post:
      operationId: verifyCompanyCapital
      tags: [referrals]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyCapitalInput" }
      responses:
        "200":
          description: Actual separately verified company capital recorded once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyCapitalRecord" }
  /admin/referrals/rates:
    get:
      operationId: getAdminReferralRates
      tags: [referrals]
      responses:
        "200":
          description: Current rates, immutable rate history and referral statistics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferralRateSettings" }
    put:
      operationId: updateReferralRates
      tags: [referrals]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReferralRateInput" }
      responses:
        "200":
          description: New version for future purchases; historical commission snapshots unchanged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferralRateSettings" }
  /referrals/notifications:
    get:
      operationId: getReferralNotifications
      tags: [referrals]
      responses:
        "200":
          description: Own unread notifications generated by actual database events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReferralNotification" }
  /referrals/notifications/{notificationId}/read:
    post:
      operationId: acknowledgeReferralNotification
      tags: [referrals]
      parameters:
        - { name: notificationId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Own notification acknowledged
          content:
            application/json:
              schema: { type: object, required: [success], properties: { success: { type: boolean } } }
  /admin/commission-fund/receipt:
    post:
      operationId: uploadCompanyCapitalReceipt
      tags: [referrals]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/CapitalReceiptInput" }
      responses:
        "200":
          description: Private validated capital evidence image
          content:
            application/json:
              schema: { type: object, required: [id], properties: { id: { type: string } } }
components:
  schemas:
    ReferralRateInput:
      type: object
      required: [tier1, tier2, tier3, expectedVersion, reason]
      properties:
        tier1: { type: string }
        tier2: { type: string }
        tier3: { type: string }
        expectedVersion: { type: integer }
        reason: { type: string, minLength: 5, maxLength: 1000 }
    CapitalReceiptInput:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary }
    ReferralNotification:
      type: object
      required: [id, type, message, createdAt]
      properties:
        id: { type: string }
        type: { type: string }
        message: { type: string }
        createdAt: { type: string }
    ReferralRateVersion:
      type: object
      required: [version, tier1, tier2, tier3, changedById, changedByAccount, changeReason, createdAt]
      properties:
        version: { type: integer }
        tier1: { type: number }
        tier2: { type: number }
        tier3: { type: number }
        changedById: { type: [string, "null"] }
        changedByAccount: { type: [string, "null"] }
        changeReason: { type: string }
        createdAt: { type: string }
    ReferralRateSettings:
      type: object
      required: [current, history, totalUsers, referralRelationships, totalCommissions]
      properties:
        current: { $ref: "#/components/schemas/ReferralRateVersion" }
        history: { type: array, items: { $ref: "#/components/schemas/ReferralRateVersion" } }
        totalUsers: { type: integer }
        referralRelationships: { type: integer }
        totalCommissions: { type: integer }
    CommissionDecisionInput:
      type: object
      required: [note, confirmed]
      properties:
        note: { type: string, minLength: 5, maxLength: 1000 }
        confirmed: { type: boolean }
    Commission:
      type: object
      required: [id, beneficiaryId, beneficiaryAccount, sourceAccount, investmentId, depositId, sourceType, sourceTransactionReference, rateVersion, planName, tier, ratePercent, basisAmount, amount, status, rejectionReason, approvedAt, paidAt, createdAt]
      properties:
        id: { type: string }
        beneficiaryId: { type: string }
        beneficiaryAccount: { type: string }
        sourceAccount: { type: string }
        investmentId: { type: string, nullable: true }
        depositId: { type: string, nullable: true }
        sourceType: { type: string, enum: [INVESTMENT, DEPOSIT] }
        sourceTransactionReference: { type: string }
        rateVersion: { type: integer }
        planName: { type: string }
        tier: { type: integer }
        ratePercent: { type: number }
        basisAmount: { type: string }
        amount: { type: string }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, PAID] }
        rejectionReason: { type: [string, "null"] }
        approvedAt: { type: [string, "null"] }
        paidAt: { type: [string, "null"] }
        createdAt: { type: string }
    CommissionPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Commission" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    CommissionAuditEntry:
      type: object
      required: [id, adminId, decision, note, createdAt]
      properties:
        id: { type: string }
        adminId: { type: string }
        decision: { type: string }
        note: { type: string }
        createdAt: { type: string }
    CompanyCapitalInput:
      type: object
