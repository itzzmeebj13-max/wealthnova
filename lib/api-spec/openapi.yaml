      properties:
        id: { type: string }
        userId: { type: string }
        userMobileNumber: { type: string }
        requestedAmount: { type: string }
        feeAmount: { type: string }
        netAmount: { type: string }
        feePercent: { type: number }
        accountName: { type: string }
        accountNumber: { type: string }
        status: { type: string, enum: [PENDING, PROCESSING, COMPLETED, REJECTED] }
        processingById: { type: [string, "null"] }
        reviewedById: { type: [string, "null"] }
        processedAt: { type: [string, "null"] }
        completedAt: { type: [string, "null"] }
        payoutReference: { type: [string, "null"] }
        verificationNote: { type: [string, "null"] }
        rejectionReason: { type: [string, "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
    WithdrawalNotification:
