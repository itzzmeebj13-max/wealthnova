      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    SuccessResponse:
      type: object
      properties:
        status:
          type: string
      required: [status]
    SessionUser:
      type: object
      properties:
        id:
          type: string
        mobileNumber:
          type: string
        referralCode:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, INVITE_ONLY]
        referredBy:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required: [id, mobileNumber, referralCode, role, status, referredBy, createdAt]
    RegistrationInput:
      type: object
      properties:
        mobileNumber:
          type: string
          minLength: 8
          maxLength: 16
          pattern: "^(09[0-9]{9}|\\+639[0-9]{9}|639[0-9]{9})$"
        password:
          type: string
          minLength: 12
          maxLength: 128
        referralCode:
          type: string
          minLength: 3
          maxLength: 32
      required: [mobileNumber, password, referralCode]
    LoginInput:
      type: object
      properties:
        mobileNumber:
          type: string
          minLength: 8
          maxLength: 16
          pattern: "^(09[0-9]{9}|\\+639[0-9]{9}|639[0-9]{9})$"
        password:
          type: string
          minLength: 1
          maxLength: 128
      required: [mobileNumber, password]
    ReferralCodeInput:
      type: object
      properties:
        referralCode:
          type: string
          minLength: 3
          maxLength: 32
      required: [referralCode]
    ReferralValidation:
      type: object
      properties:
        valid:
          type: boolean
        message:
          type: string
      required: [valid, message]
    ReferralOverview:
      type: object
      properties:
        referralCode:
          type: string
        referralLink:
          type: string
          format: uri-reference
        referralCount:
          type: integer
          minimum: 0
        tier1Count: { type: integer }
        tier2Count: { type: integer }
        tier3Count: { type: integer }
        totalInvitedUsers: { type: integer }
        totalQualifiedReferrals: { type: integer }
        totalCommissionsEarned: { type: string, description: Actually completed funded wallet credits only. }
        rates:
          type: array
          items:
            type: object
            required: [tier, percent]
            properties:
              tier: { type: integer }
              percent: { type: number }
        commissionTotals:
          type: object
          required: [total, pending, approved, rejected, paid]
          properties:
            total:
              type: string
              description: All recorded commission amounts across all statuses, including rejected; not a spendable balance.
            pending: { type: string }
            approved: { type: string }
            rejected: { type: string }
            paid: { type: string }
      required: [referralCode, referralLink, referralCount, tier1Count, tier2Count, tier3Count, totalInvitedUsers, totalQualifiedReferrals, totalCommissionsEarned, rates, commissionTotals]
    DashboardSummary:
      type: object
      properties:
        referralCount:
          type: integer
          minimum: 0
        role:
          type: string
          enum: [USER, ADMIN]
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, INVITE_ONLY]
        createdAt:
          type: string
          format: date-time
        availableBalance:
          type: string
          description: Exact PHP balance formatted with two decimal places.
          pattern: "^[0-9]+\\.[0-9]{2}$"
        totalInvested:
          type: string
          description: Sum of non-cancelled investment principals.
          pattern: "^[0-9]+\\.[0-9]{2}$"
        totalEarnings:
          type: string
          description: Verified earning credits only; scheduled plan figures are not credited automatically.
          pattern: "^[0-9]+\\.[0-9]{2}$"
        activeInvestments:
          type: array
          items:
            $ref: "#/components/schemas/ActiveInvestment"
      required: [referralCount, role, status, createdAt, availableBalance, totalInvested, totalEarnings, activeInvestments]
    ActiveInvestment:
      type: object
      properties:
        id:
          type: string
        planId:
          type: string
        planName:
          type: string
        principalAmount:
          type: string
          pattern: "^[0-9]+\\.[0-9]{2}$"
        dailyAmount:
          type: string
          description: Informational plan figure; not a guaranteed or automatically credited earning.
          pattern: "^[0-9]+\\.[0-9]{2}$"
        duration:
          type: integer
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        daysCompleted:
          type: integer
        daysRemaining:
          type: integer
        accumulatedAmount:
          type: string
          description: Verified earnings credited to this investment only.
          pattern: "^[0-9]+\\.[0-9]{2}$"
        status:
          type: string
          enum: [ACTIVE, COMPLETED, CANCELLED]
      required: [id, planId, planName, principalAmount, dailyAmount, duration, startDate, endDate, daysCompleted, daysRemaining, accumulatedAmount, status]
    Plan:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        currency:
          type: string
        principalAmount:
          type: string
          pattern: "^[0-9]+\\.[0-9]{2}$"
        dailyAmount:
          type: string
          description: Informational plan figure; not a guaranteed or automatically credited earning.
          pattern: "^[0-9]+\\.[0-9]{2}$"
        duration:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [AVAILABLE, UNAVAILABLE]
      required: [id, name, currency, principalAmount, dailyAmount, duration, status]
    InvestmentStartInput:
      type: object
      properties:
        planId:
          type: string
          minLength: 1
          maxLength: 64
        idempotencyKey:
          type: string
          minLength: 16
          maxLength: 128
      required: [planId, idempotencyKey]
    InvestmentStartResult:
      type: object
      properties:
        investment:
          $ref: "#/components/schemas/ActiveInvestment"
        availableBalance:
          type: string
          pattern: "^[0-9]+\\.[0-9]{2}$"
        replayed:
          type: boolean
      required: [investment, availableBalance, replayed]
    DepositAvailability:
      type: object
      properties:
        enabled:
          type: boolean
        message:
          type: string
      required: [enabled, message]

